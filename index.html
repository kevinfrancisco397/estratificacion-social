<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estratificación Social - Lic. Kevin Francisco Muñoz Paniagua</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
  .presentation {
    width: 640px;
    height: 389px;
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .slide-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    background: #0a1628;
  }
  .slide-img.active { display: block; }
  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .presentation:hover .controls { opacity: 1; }
  .btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.35); }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .counter {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: #f0a500;
    transition: width 0.3s ease;
  }
</style>
</head>
<body>
<div class="presentation" id="pres">
