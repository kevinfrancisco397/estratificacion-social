<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
  .presentation {
    width: 640px;
    height: 389px;
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .slide-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    background: #0a1628;
  }
  .slide-img.active { display: block; }
  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .presentation:hover .controls { opacity: 1; }
  .btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.35); }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .counter {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: #f0a500;
    transition: width 0.3s ease;
  }
</style>

<script>
(function(){
  var current = 0;
  var total = 21;
  var slides = document.querySelectorAll('.slide-img');
  var progress = document.getElementById('progress');
  var currentEl = document.getElementById('current');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  function update() {
    for (var i = 0; i < slides.length; i++) {
      slides[i].classList.toggle('active', i === current);
    }
    currentEl.textContent = current + 1;
    progress.style.width = ((current + 1) / total * 100) + '%';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
  }

  window.changeSlide = function(dir) {
    var next = current + dir;
    if (next >= 0 && next < total) {
      current = next;
      update();
    }
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
    if (e.key === 'ArrowLeft') changeSlide(-1);
  });

  // Click on image advances
  document.getElementById('pres').addEventListener('click', function(e) {
    if (e.target.classList.contains('slide-img')) changeSlide(1);
  });

  update();
})();
</script>
</body>
</html>
